<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Room Terra: the complete 2 KiB SRAM budget</title><desc id="desc">Verified public source build v0.12.9. Values are in bytes unless stated otherwise.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#292b2a" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="1600" rx="0" fill="#f6f6f3" stroke="none" stroke-width="1"/><text data-check="1" x="50" y="83" font-family="Consolas, monospace" font-size="42" font-weight="400" fill="#292b2a" text-anchor="start">AIR / 328</text><text data-check="1" x="1150" y="65" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#292b2a" text-anchor="end">ARDUINO UNO MINI</text><text data-check="1" x="1150" y="99" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#545c56" text-anchor="end">LIMITED EDITION</text><text data-check="1" x="50" y="160" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#545c56" text-anchor="start">ROOM TERRA / ENGINEERING NOTES</text><text data-check="1" x="1150" y="160" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#545c56" text-anchor="end">01 / 04</text><rect x="44" y="199" width="1112" height="1323" rx="24" fill="#383b38" stroke="none" stroke-width="1"/><rect x="60" y="217" width="1080" height="1232" rx="6" fill="#e5e6e1" stroke="#292b2a" stroke-width="3"/><text data-check="1" x="90" y="1495" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#d4d8d0" text-anchor="start">PUBLIC SOURCE / v0.12.9</text><text data-check="1" x="1110" y="1495" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#d4d8d0" text-anchor="end">ATMEGA328P / 16 MHz</text><text data-check="1" x="50" y="1563" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#545c56" text-anchor="start">github.com/Corvaxdev/uno-mini-air</text><text data-check="1" x="106" y="306" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#292b2a" text-anchor="start">SRAM and Flash</text><text data-check="1" x="106" y="363" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#545c56" text-anchor="start">HTTP server + sensors + simulation</text><text data-check="1" x="106" y="493" font-family="Consolas, monospace" font-size="120" font-weight="400" fill="#292b2a" text-anchor="start">2,048</text><text data-check="1" x="503" y="493" font-family="Consolas, monospace" font-size="43" font-weight="400" fill="#292b2a" text-anchor="start">B SRAM</text><rect x="106" y="537" width="281.734375" height="44" rx="0" fill="#426c39" stroke="none" stroke-width="1"/><rect x="387.734375" y="537" width="247.0" height="44" rx="0" fill="#292b2a" stroke="none" stroke-width="1"/><rect x="634.734375" y="537" width="191.0390625" height="44" rx="0" fill="#858e81" stroke="none" stroke-width="1"/><rect x="825.7734375" y="537" width="268.2265625" height="44" rx="0" fill="#c6ccc0" stroke="none" stroke-width="1"/><text data-check="1" x="106" y="667" font-family="Consolas, monospace" font-size="57" font-weight="400" fill="#426c39" text-anchor="start">584 B</text><text data-check="1" x="106" y="721" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#292b2a" text-anchor="start">World state</text><text data-check="1" x="106" y="767" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#545c56" text-anchor="start">Plants + 128 animal slots</text><text data-check="1" x="622" y="667" font-family="Consolas, monospace" font-size="57" font-weight="400" fill="#292b2a" text-anchor="start">512 B</text><text data-check="1" x="622" y="721" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#292b2a" text-anchor="start">HTTP workspace</text><text data-check="1" x="622" y="767" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#545c56" text-anchor="start">Shared across 4 peers</text><text data-check="1" x="106" y="839" font-family="Consolas, monospace" font-size="57" font-weight="400" fill="#65705f" text-anchor="start">396 B</text><text data-check="1" x="106" y="893" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#292b2a" text-anchor="start">Other globals</text><text data-check="1" x="106" y="939" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#545c56" text-anchor="start">Sensors, network, timers</text><text data-check="1" x="622" y="839" font-family="Consolas, monospace" font-size="57" font-weight="400" fill="#545c56" text-anchor="start">556 B</text><text data-check="1" x="622" y="893" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#292b2a" text-anchor="start">Stack / runtime</text><text data-check="1" x="622" y="939" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#545c56" text-anchor="start">Headroom before stack use</text><path d="M106 981L1094 981" fill="none" stroke="#a6aaa3" stroke-width="3"/><text data-check="1" x="106" y="1052" font-family="Arial, sans-serif" font-size="47" font-weight="700" fill="#292b2a" text-anchor="start">Website storage</text><text data-check="1" x="106" y="1114" font-family="Consolas, monospace" font-size="48" font-weight="400" fill="#426c39" text-anchor="start">10,971 B gzip</text><text data-check="1" x="106" y="1172" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#292b2a" text-anchor="start">Streamed through the same 512 B workspace.</text><text data-check="1" x="106" y="1221" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#292b2a" text-anchor="start">The browser decompresses and draws it.</text><text data-check="1" x="106" y="1323" font-family="Consolas, monospace" font-size="48" font-weight="400" fill="#292b2a" text-anchor="start">31,836 / 32,256 B</text><text data-check="1" x="106" y="1374" font-family="Arial, sans-serif" font-size="33" font-weight="400" fill="#545c56" text-anchor="start">Application Flash: 420 B spare; 512 B bootloader.</text><text data-check="1" x="106" y="1420" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#545c56" text-anchor="start">W5500 socket buffers are separate from MCU SRAM.</text></svg>
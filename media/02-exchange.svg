<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Room Terra: how a shared action reaches other browsers</title><desc id="desc">Verified public source build v0.12.9. Values are in bytes unless stated otherwise.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#292b2a" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="1600" rx="0" fill="#f6f6f3" stroke="none" stroke-width="1"/><text data-check="1" x="50" y="83" font-family="Consolas, monospace" font-size="42" font-weight="400" fill="#292b2a" text-anchor="start">AIR / 328</text><text data-check="1" x="1150" y="65" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#292b2a" text-anchor="end">ARDUINO UNO MINI</text><text data-check="1" x="1150" y="99" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#545c56" text-anchor="end">LIMITED EDITION</text><text data-check="1" x="50" y="160" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#545c56" text-anchor="start">ROOM TERRA / ENGINEERING NOTES</text><text data-check="1" x="1150" y="160" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#545c56" text-anchor="end">02 / 04</text><rect x="44" y="199" width="1112" height="1323" rx="24" fill="#383b38" stroke="none" stroke-width="1"/><rect x="60" y="217" width="1080" height="1232" rx="6" fill="#e5e6e1" stroke="#292b2a" stroke-width="3"/><text data-check="1" x="90" y="1495" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#d4d8d0" text-anchor="start">PUBLIC SOURCE / v0.12.9</text><text data-check="1" x="1110" y="1495" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#d4d8d0" text-anchor="end">ATMEGA328P / 16 MHz</text><text data-check="1" x="50" y="1563" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#545c56" text-anchor="start">github.com/Corvaxdev/uno-mini-air</text><text data-check="1" x="106" y="306" font-family="Arial, sans-serif" font-size="57" font-weight="700" fill="#292b2a" text-anchor="start">HTTP exchange</text><text data-check="1" x="106" y="363" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#545c56" text-anchor="start">Arduino owns the state. Browsers render it.</text><text data-check="1" x="180" y="458" font-family="Consolas, monospace" font-size="30" font-weight="400" fill="#292b2a" text-anchor="middle">PHONE A</text><text data-check="1" x="600" y="458" font-family="Consolas, monospace" font-size="30" font-weight="400" fill="#292b2a" text-anchor="middle">ARDUINO</text><text data-check="1" x="1020" y="458" font-family="Consolas, monospace" font-size="30" font-weight="400" fill="#292b2a" text-anchor="middle">PHONE B</text><path d="M180 487L180 1220" fill="none" stroke="#a6aaa3" stroke-width="3" stroke-dasharray="8 10"/><path d="M600 487L600 1220" fill="none" stroke="#a6aaa3" stroke-width="3" stroke-dasharray="8 10"/><path d="M1020 487L1020 1220" fill="none" stroke="#a6aaa3" stroke-width="3" stroke-dasharray="8 10"/><rect x="102" y="511" width="475" height="94" rx="0" fill="#e5e6e1" stroke="none" stroke-width="1"/><text data-check="1" x="114" y="548" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#292b2a" text-anchor="start">Select a cell</text><text data-check="1" x="114" y="591" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#545c56" text-anchor="start">Local only; sends nothing</text><rect x="105" y="635" width="470" height="50" rx="0" fill="#e5e6e1" stroke="none" stroke-width="1"/><text data-check="1" x="115" y="670" font-family="Consolas, monospace" font-size="36" font-weight="400" fill="#292b2a" text-anchor="start">PUT /life/XYZ</text><path d="M180 697L600 697" fill="none" stroke="#292b2a" stroke-width="3" marker-end="url(#arrow)"/><rect x="221" y="726" width="350" height="45" rx="0" fill="#e5e6e1" stroke="none" stroke-width="1"/><text data-check="1" x="232" y="760" font-family="Consolas, monospace" font-size="33" font-weight="400" fill="#292b2a" text-anchor="start">202 / queued</text><path d="M600 787L180 787" fill="none" stroke="#292b2a" stroke-width="3" marker-end="url(#arrow)"/><rect x="245" y="826" width="710" height="164" rx="8" fill="#bbceb0" stroke="none" stroke-width="1"/><text data-check="1" x="600" y="873" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#292b2a" text-anchor="middle">Next 10-second step</text><text data-check="1" x="600" y="922" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#292b2a" text-anchor="middle">Check cell + cost; apply if valid.</text><text data-check="1" x="600" y="966" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#292b2a" text-anchor="middle">Finish the step; expose the snapshot.</text><text data-check="1" x="387" y="1046" font-family="Consolas, monospace" font-size="31" font-weight="400" fill="#292b2a" text-anchor="middle">GET /life</text><text data-check="1" x="816" y="1080" font-family="Consolas, monospace" font-size="31" font-weight="400" fill="#292b2a" text-anchor="middle">GET /life</text><path d="M180 1074L600 1074" fill="none" stroke="#292b2a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 1108L600 1108" fill="none" stroke="#292b2a" stroke-width="3" marker-end="url(#arrow)"/><text data-check="1" x="386" y="1143" font-family="Consolas, monospace" font-size="32" font-weight="400" fill="#292b2a" text-anchor="middle">480 B body</text><text data-check="1" x="816" y="1177" font-family="Consolas, monospace" font-size="32" font-weight="400" fill="#292b2a" text-anchor="middle">480 B body</text><path d="M600 1171L180 1171" fill="none" stroke="#292b2a" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 1205L1020 1205" fill="none" stroke="#292b2a" stroke-width="3" marker-end="url(#arrow)"/><text data-check="1" x="106" y="1286" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#292b2a" text-anchor="start">Each browser polls independently.</text><text data-check="1" x="106" y="1340" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#292b2a" text-anchor="start">Updates can arrive at different times.</text><text data-check="1" x="106" y="1390" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#545c56" text-anchor="start">Headers are extra. 202 confirms the queue, not success.</text></svg>
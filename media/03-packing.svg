<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Room Terra: a 480-byte binary world snapshot</title><desc id="desc">Verified public source build v0.12.9. Values are in bytes unless stated otherwise.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#292b2a" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="1600" rx="0" fill="#f6f6f3" stroke="none" stroke-width="1"/><text data-check="1" x="50" y="83" font-family="Consolas, monospace" font-size="42" font-weight="400" fill="#292b2a" text-anchor="start">AIR / 328</text><text data-check="1" x="1150" y="65" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#292b2a" text-anchor="end">ARDUINO UNO MINI</text><text data-check="1" x="1150" y="99" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#545c56" text-anchor="end">LIMITED EDITION</text><text data-check="1" x="50" y="160" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#545c56" text-anchor="start">ROOM TERRA / ENGINEERING NOTES</text><text data-check="1" x="1150" y="160" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#545c56" text-anchor="end">03 / 04</text><rect x="44" y="199" width="1112" height="1323" rx="24" fill="#383b38" stroke="none" stroke-width="1"/><rect x="60" y="217" width="1080" height="1232" rx="6" fill="#e5e6e1" stroke="#292b2a" stroke-width="3"/><text data-check="1" x="90" y="1495" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#d4d8d0" text-anchor="start">PUBLIC SOURCE / v0.12.9</text><text data-check="1" x="1110" y="1495" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#d4d8d0" text-anchor="end">ATMEGA328P / 16 MHz</text><text data-check="1" x="50" y="1563" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#545c56" text-anchor="start">github.com/Corvaxdev/uno-mini-air</text><text data-check="1" x="106" y="306" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#292b2a" text-anchor="start">World snapshot / 480 B</text><text data-check="1" x="106" y="363" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#545c56" text-anchor="start">One binary HTTP response body per snapshot.</text><rect x="106" y="419" width="98.8" height="42" rx="0" fill="#858e81" stroke="none" stroke-width="1"/><rect x="204.8" y="419" width="526.9333333333333" height="42" rx="0" fill="#426c39" stroke="none" stroke-width="1"/><rect x="731.7333333333333" y="419" width="362.26666666666665" height="42" rx="0" fill="#292b2a" stroke="none" stroke-width="1"/><text data-check="1" x="106" y="545" font-family="Consolas, monospace" font-size="49" font-weight="400" fill="#426c39" text-anchor="start">48 B</text><text data-check="1" x="374" y="545" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#292b2a" text-anchor="start">Metadata</text><text data-check="1" x="106" y="603" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#545c56" text-anchor="start">Step, counts, readings, action result.</text><text data-check="1" x="106" y="693" font-family="Consolas, monospace" font-size="49" font-weight="400" fill="#426c39" text-anchor="start">256 B</text><text data-check="1" x="374" y="693" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#292b2a" text-anchor="start">Plants</text><text data-check="1" x="106" y="751" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#545c56" text-anchor="start">1,024 cells x 2 bits: biomass 0-3.</text><text data-check="1" x="106" y="841" font-family="Consolas, monospace" font-size="49" font-weight="400" fill="#426c39" text-anchor="start">176 B</text><text data-check="1" x="374" y="841" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#292b2a" text-anchor="start">Animal block</text><text data-check="1" x="106" y="899" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#545c56" text-anchor="start">128 records x 11 bits; fixed capacity.</text><path d="M106 946L1094 946" fill="none" stroke="#a6aaa3" stroke-width="3"/><text data-check="1" x="106" y="1018" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#292b2a" text-anchor="start">16 bits in RAM / 11 on the wire</text><rect x="106" y="1062" width="898" height="58" rx="0" fill="#bbceb0" stroke="none" stroke-width="1"/><rect x="1004" y="1062" width="90" height="58" rx="0" fill="#426c39" stroke="none" stroke-width="1"/><text data-check="1" x="556" y="1103" font-family="Consolas, monospace" font-size="31" font-weight="400" fill="#292b2a" text-anchor="middle">POSITION / 10 bits</text><text data-check="1" x="1049" y="1103" font-family="Consolas, monospace" font-size="33" font-weight="400" fill="#f6f6f3" text-anchor="middle">1</text><text data-check="1" x="1094" y="1161" font-family="Consolas, monospace" font-size="31" font-weight="400" fill="#426c39" text-anchor="end">SPECIES / 1 bit</text><text data-check="1" x="106" y="1227" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#292b2a" text-anchor="start">Energy and update marker stay on the MCU.</text><text data-check="1" x="106" y="1279" font-family="Arial, sans-serif" font-size="37" font-weight="400" fill="#292b2a" text-anchor="start">80 B saved in the maximum animal block.</text><text data-check="1" x="106" y="1350" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#545c56" text-anchor="start">W5500 handles TCP/IP and socket buffering.</text><text data-check="1" x="106" y="1395" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#545c56" text-anchor="start">The 480 B body excludes all network headers.</text></svg>